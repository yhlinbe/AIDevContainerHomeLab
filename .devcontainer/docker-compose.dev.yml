version: '3.8'

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 5

networks:
  community-net:
    driver: bridge

volumes:
  etcd_data:
  pg_data_node1:
  pg_data_node2:
  kafka_data:
  seaweed_data:
  valkey_data:
  clickhouse_data:

services:
  valkey:
    image: valkey/valkey:7.2-alpine
    restart: unless-stopped
    networks:
      - community-net
    ports:
      - "${HOST_VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --save 60 1 --loglevel notice
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      <<: *healthcheck-defaults

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    restart: unless-stopped
    networks:
      - community-net
    ports:
      - "${HOST_CLICKHOUSE_PORT:-8123}:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=otel_db
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    restart: unless-stopped
    networks:
      - community-net
    ports:
      - "${HOST_OTEL_GRPC_PORT:-4317}:4317"
      - "${HOST_OTEL_HTTP_PORT:-4318}:4318"
      - "8888:8888"
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - clickhouse

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    networks:
      - community-net
    ports:
      - "${HOST_GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        mkdir -p /etc/grafana/provisioning/dashboards
        mkdir -p /var/lib/grafana/dashboards

        cat <<'EOF' > /etc/grafana/provisioning/datasources/clickhouse.yaml
        apiVersion: 1
        datasources:
          - name: ClickHouse-O11y
            type: grafana-clickhouse-datasource
            access: proxy
            jsonData:
              host: clickhouse
              port: 9000
              protocol: native
              username: default
              secure: false
              defaultDatabase: otel_db
            isDefault: true
        EOF

        cat <<'EOF' > /etc/grafana/provisioning/dashboards/dashboards.yaml
        apiVersion: 1
        providers:
          - name: 'OTEL ClickHouse Dashboards'
            orgId: 1
            folder: 'Observability'
            type: file
            disableDeletion: false
            updateIntervalSeconds: 10
            allowUiUpdates: true
            options:
              path: /var/lib/grafana/dashboards
        EOF

        cat <<'EOF' > /var/lib/grafana/dashboards/otel-apm-traces.json
        {
          "annotations": { "list": [] },
          "editable": true,
          "fiscalYearStartMonth": 0,
          "graphTooltip": 1,
          "id": null,
          "title": "OTEL - Application APM & Traces",
          "uid": "otel-apm-traces",
          "tags": ["opentelemetry", "clickhouse", "traces"],
          "timezone": "browser",
          "panels": [
            {
              "collapsed": false,
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
              "id": 1,
              "title": "Request Rate (RPS) by Service",
              "type": "timeseries",
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse-O11y" },
              "targets": [
                {
                  "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse-O11y" },
                  "queryType": "sql",
                  "rawSql": "SELECT ServiceName AS metric, $__timeGroup(Timestamp, '10s') AS time, count() / 10 AS value FROM otel_traces WHERE $__timeFilter(Timestamp) GROUP BY metric, time ORDER BY time ASC",
                  "refId": "A"
                }
              ]
            },
            {
              "collapsed": false,
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
              "id": 2,
              "title": "P95 Latency by Service (ms)",
              "type": "timeseries",
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse-O11y" },
              "targets": [
                {
                  "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse-O11y" },
                  "queryType": "sql",
                  "rawSql": "SELECT ServiceName AS metric, $__timeGroup(Timestamp, '10s') AS time, quantile(0.95)(Duration / 1000000) AS value FROM otel_traces WHERE $__timeFilter(Timestamp) GROUP BY metric, time ORDER BY time ASC",
                  "refId": "A"
                }
              ]
            },
            {
              "collapsed": false,
              "gridPos": { "h": 12, "w": 24, "x": 0, "y": 8 },
              "id": 3,
              "title": "Recent Slow Traces Search",
              "type": "table",
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse-O11y" },
              "targets": [
                {
                  "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse-O11y" },
                  "queryType": "sql",
                  "rawSql": "SELECT Timestamp, TraceId, ServiceName, SpanName, round(Duration / 1000000, 2) AS `Duration (ms)`, StatusCode FROM otel_traces WHERE $__timeFilter(Timestamp) ORDER BY Duration DESC LIMIT 50",
                  "refId": "A"
                }
              ]
            }
          ],
          "schemaVersion": 38,
          "time": { "from": "now-1h", "to": "now" }
        }
        EOF

        cat <<'EOF' > /var/lib/grafana/dashboards/otel-logs.json
        {
          "annotations": { "list": [] },
          "editable": true,
          "fiscalYearStartMonth": 0,
          "graphTooltip": 0,
          "id": null,
          "title": "OTEL - Realtime Logs Explorer",
          "uid": "otel-logs-explorer",
          "tags": ["opentelemetry", "clickhouse", "logs"],
          "timezone": "browser",
          "panels": [
            {
              "collapsed": false,
              "gridPos": { "h": 6, "w": 24, "x": 0, "y": 0 },
              "id": 1,
              "title": "Log Volume by Severity",
              "type": "timeseries",
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse-O11y" },
              "targets": [
                {
                  "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse-O11y" },
                  "queryType": "sql",
                  "rawSql": "SELECT SeverityText AS metric, $__timeGroup(Timestamp, '10s') AS time, count() AS value FROM otel_logs WHERE $__timeFilter(Timestamp) GROUP BY metric, time ORDER BY time ASC",
                  "refId": "A"
                }
              ]
            },
            {
              "collapsed": false,
              "gridPos": { "h": 14, "w": 24, "x": 0, "y": 6 },
              "id": 2,
              "title": "Application Logs Feed",
              "type": "table",
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse-O11y" },
              "targets": [
                {
                  "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse-O11y" },
                  "queryType": "sql",
                  "rawSql": "SELECT Timestamp, ServiceName, SeverityText, Body, TraceId FROM otel_logs WHERE $__timeFilter(Timestamp) ORDER BY Timestamp DESC LIMIT 100",
                  "refId": "A"
                }
              ]
            }
          ],
          "schemaVersion": 38,
          "time": { "from": "now-1h", "to": "now" }
        }
        EOF

        exec /run.sh
    depends_on:
      - clickhouse

  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    restart: unless-stopped
    networks:
      - community-net
    environment:
      - ETCD_ALLOW_NONE_AUTHENTICATION=yes
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      <<: *healthcheck-defaults

  patroni-db1:
    image: ghcr.io/zalando/spilo-15:3.0-p1
    restart: unless-stopped
    networks:
      - community-net
    environment:
      SCOPE: community-db
      PATRONI_NAME: patroni-db1
      PATRONI_ETCD3_HOSTS: 'etcd:2379'
      PATRONI_SCOPE: community-db
      PATRONI_ADMIN_PASSWORD: 'AdminPassword123'
      PATRONI_SUPERUSER_PASSWORD: 'PGPassword123'
      PATRONI_REPLICATION_PASSWORD: 'ReplPassword123'
    volumes:
      - pg_data_node1:/home/postgres/pgdata
    depends_on:
      etcd:
        condition: service_healthy

  patroni-db2:
    image: ghcr.io/zalando/spilo-15:3.0-p1
    restart: unless-stopped
    networks:
      - community-net
    environment:
      SCOPE: community-db
      PATRONI_NAME: patroni-db2
      PATRONI_ETCD3_HOSTS: 'etcd:2379'
      PATRONI_SCOPE: community-db
      PATRONI_ADMIN_PASSWORD: 'AdminPassword123'
      PATRONI_SUPERUSER_PASSWORD: 'PGPassword123'
      PATRONI_REPLICATION_PASSWORD: 'ReplPassword123'
    volumes:
      - pg_data_node2:/home/postgres/pgdata
    depends_on:
      etcd:
        condition: service_healthy
      patroni-db1:
        condition: service_started

  pg-haproxy:
    image: haproxy:2.8-alpine
    restart: unless-stopped
    networks:
      - community-net
    ports:
      - "${HOST_PG_PORT:-5432}:5432"
      - "${HOST_HAPROXY_STATS_PORT:-7000}:7000"
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - patroni-db1
      - patroni-db2

  casdoor:
    image: casbin/casdoor:v1.540.0
    restart: unless-stopped
    networks:
      - community-net
    ports:
      - "${HOST_CASDOOR_PORT:-8000}:8000"
    environment:
      - driverName=postgres
      - dataSourceName=user=postgres password=PGPassword123 host=pg-haproxy port=5432 sslmode=disable dbname=casdoor
      - dbName=casdoor
    depends_on:
      - pg-haproxy

  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    networks:
      - community-net
    ports:
      - "${HOST_KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    networks:
      - community-net
    ports:
      - "${HOST_SEAWEED_PORT:-8333}:8333"
      - "9333:9333"
    command: "server -dir=/data -s3 -s3.port=8333"
    volumes:
      - seaweed_data:/data