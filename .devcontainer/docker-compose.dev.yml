version: '3.8'

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 5

networks:
  community-net:
    driver: bridge

volumes:
  etcd_data:
  pg_data_node1:
  pg_data_node2:
  kafka_data:
  seaweed_data:
  valkey_data:
  clickhouse_data:

services:
  # ---------------------------------------------------------------------------
  # 1. High-Performance Caching (Valkey - Redis Drop-in Replacement)
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: community-valkey
    restart: unless-stopped
    networks:
      - community-net
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --save 60 1 --loglevel notice
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      <<: *healthcheck-defaults

  # ---------------------------------------------------------------------------
  # 2. Observability & Telemetry (ClickHouse + OpenTelemetry Collector)
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: community-clickhouse
    restart: unless-stopped
    networks:
      - community-net
    ports:
      - "8123:8123"   # HTTP Interface / Query
      - "9000:9000"   # Native Client Interface
    environment:
      - CLICKHOUSE_DB=otel_db
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    container_name: community-otel-collector
    restart: unless-stopped
    networks:
      - community-net
    ports:
      - "4317:4317"   # OTLP gRPC receiver (NestJS / Go SDK 寫入端)
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Collector Metrics
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat <<'EOF' > /etc/otelcol-contrib/config.yaml
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318

        processors:
          batch:
            timeout: 1s
            send_batch_size: 1024

        exporters:
          clickhouse:
            endpoint: "tcp://clickhouse:9000?database=otel_db"
            ttl: 72h

        service:
          pipelines:
            traces:
              receivers: [otlp]
              processors: [batch]
              exporters: [clickhouse]
            metrics:
              receivers: [otlp]
              processors: [batch]
              exporters: [clickhouse]
            logs:
              receivers: [otlp]
              processors: [batch]
              exporters: [clickhouse]
        EOF
        exec /otelcol-contrib --config=/etc/otelcol-contrib/config.yaml
    depends_on:
      - clickhouse

  grafana:
    image: grafana/grafana:10.4.0
    container_name: community-grafana
    restart: unless-stopped
    networks:
      - community-net
    ports:
      - "3001:3000"   # 對外連線端口 (http://localhost:3001)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # 1. 建立設定檔目錄
        mkdir -p /etc/grafana/provisioning/datasources
        mkdir -p /etc/grafana/provisioning/dashboards
        mkdir -p /var/lib/grafana/dashboards

        # 2. 自動配置 ClickHouse Data Source
        cat <<'EOF' > /etc/grafana/provisioning/datasources/clickhouse.yaml
        apiVersion: 1
        datasources:
          - name: ClickHouse-O11y
            type: grafana-clickhouse-datasource
            access: proxy
            jsonData:
              host: clickhouse
              port: 9000
              protocol: native
              username: default
              secure: false
              defaultDatabase: otel_db
            isDefault: true
        EOF

        # 3. 配置 Dashboard Provisioning 載入器
        cat <<'EOF' > /etc/grafana/provisioning/dashboards/dashboards.yaml
        apiVersion: 1
        providers:
          - name: 'OTEL ClickHouse Dashboards'
            orgId: 1
            folder: 'Observability'
            type: file
            disableDeletion: false
            updateIntervalSeconds: 10
            allowUiUpdates: true
            options:
              path: /var/lib/grafana/dashboards
        EOF

        # 4. 寫入 APM & Traces Dashboard JSON
        cat <<'EOF' > /var/lib/grafana/dashboards/otel-apm-traces.json
        {
          "annotations": { "list": [] },
          "editable": true,
          "fiscalYearStartMonth": 0,
          "graphTooltip": 1,
          "id": null,
          "title": "OTEL - Application APM & Traces",
          "uid": "otel-apm-traces",
          "tags": ["opentelemetry", "clickhouse", "traces"],
          "timezone": "browser",
          "panels": [
            {
              "collapsed": false,
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
              "id": 1,
              "title": "Request Rate (RPS) by Service",
              "type": "timeseries",
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse-O11y" },
              "targets": [
                {
                  "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse-O11y" },
                  "queryType": "sql",
                  "rawSql": "SELECT ServiceName AS metric, $__timeGroup(Timestamp, '10s') AS time, count() / 10 AS value FROM otel_traces WHERE $__timeFilter(Timestamp) GROUP BY metric, time ORDER BY time ASC",
                  "refId": "A"
                }
              ]
            },
            {
              "collapsed": false,
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
              "id": 2,
              "title": "P95 Latency by Service (ms)",
              "type": "timeseries",
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse-O11y" },
              "targets": [
                {
                  "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse-O11y" },
                  "queryType": "sql",
                  "rawSql": "SELECT ServiceName AS metric, $__timeGroup(Timestamp, '10s') AS time, quantile(0.95)(Duration / 1000000) AS value FROM otel_traces WHERE $__timeFilter(Timestamp) GROUP BY metric, time ORDER BY time ASC",
                  "refId": "A"
                }
              ]
            },
            {
              "collapsed": false,
              "gridPos": { "h": 12, "w": 24, "x": 0, "y": 8 },
              "id": 3,
              "title": "Recent Slow Traces Search",
              "type": "table",
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse-O11y" },
              "targets": [
                {
                  "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse-O11y" },
                  "queryType": "sql",
                  "rawSql": "SELECT Timestamp, TraceId, ServiceName, SpanName, round(Duration / 1000000, 2) AS `Duration (ms)`, StatusCode FROM otel_traces WHERE $__timeFilter(Timestamp) ORDER BY Duration DESC LIMIT 50",
                  "refId": "A"
                }
              ]
            }
          ],
          "schemaVersion": 38,
          "time": { "from": "now-1h", "to": "now" }
        }
        EOF

        # 5. 寫入 Application Logs Dashboard JSON
        cat <<'EOF' > /var/lib/grafana/dashboards/otel-logs.json
        {
          "annotations": { "list": [] },
          "editable": true,
          "fiscalYearStartMonth": 0,
          "graphTooltip": 0,
          "id": null,
          "title": "OTEL - Realtime Logs Explorer",
          "uid": "otel-logs-explorer",
          "tags": ["opentelemetry", "clickhouse", "logs"],
          "timezone": "browser",
          "panels": [
            {
              "collapsed": false,
              "gridPos": { "h": 6, "w": 24, "x": 0, "y": 0 },
              "id": 1,
              "title": "Log Volume by Severity",
              "type": "timeseries",
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse-O11y" },
              "targets": [
                {
                  "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse-O11y" },
                  "queryType": "sql",
                  "rawSql": "SELECT SeverityText AS metric, $__timeGroup(Timestamp, '10s') AS time, count() AS value FROM otel_logs WHERE $__timeFilter(Timestamp) GROUP BY metric, time ORDER BY time ASC",
                  "refId": "A"
                }
              ]
            },
            {
              "collapsed": false,
              "gridPos": { "h": 14, "w": 24, "x": 0, "y": 6 },
              "id": 2,
              "title": "Application Logs Feed",
              "type": "table",
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse-O11y" },
              "targets": [
                {
                  "datasource": { "type": "grafana-clickhouse-datasource", "uid": "ClickHouse-O11y" },
                  "queryType": "sql",
                  "rawSql": "SELECT Timestamp, ServiceName, SeverityText, Body, TraceId FROM otel_logs WHERE $__timeFilter(Timestamp) ORDER BY Timestamp DESC LIMIT 100",
                  "refId": "A"
                }
              ]
            }
          ],
          "schemaVersion": 38,
          "time": { "from": "now-1h", "to": "now" }
        }
        EOF

        # 6. 啟動 Grafana 主程序
        exec /run.sh
    depends_on:
      - clickhouse

  # ---------------------------------------------------------------------------
  # 3. PostgreSQL HA Cluster (etcd + Patroni Node 1/2 + HAProxy)
  # ---------------------------------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: community-etcd
    restart: unless-stopped
    networks:
      - community-net
    environment:
      - ETCD_ALLOW_NONE_AUTHENTICATION=yes
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      <<: *healthcheck-defaults

  patroni-db1:
    image: zalando/spilo-15:3.0-p1
    container_name: patroni-db1
    restart: unless-stopped
    networks:
      - community-net
    environment:
      SCOPE: community-db
      PATRONI_NAME: patroni-db1
      PATRONI_ETCD3_HOSTS: 'etcd:2379'
      PATRONI_SCOPE: community-db
      PATRONI_ADMIN_PASSWORD: 'AdminPassword123'
      PATRONI_SUPERUSER_PASSWORD: 'PGPassword123'
      PATRONI_REPLICATION_PASSWORD: 'ReplPassword123'
    volumes:
      - pg_data_node1:/home/postgres/pgdata
    depends_on:
      etcd:
        condition: service_healthy

  patroni-db2:
    image: zalando/spilo-15:3.0-p1
    container_name: patroni-db2
    restart: unless-stopped
    networks:
      - community-net
    environment:
      SCOPE: community-db
      PATRONI_NAME: patroni-db2
      PATRONI_ETCD3_HOSTS: 'etcd:2379'
      PATRONI_SCOPE: community-db
      PATRONI_ADMIN_PASSWORD: 'AdminPassword123'
      PATRONI_SUPERUSER_PASSWORD: 'PGPassword123'
      PATRONI_REPLICATION_PASSWORD: 'ReplPassword123'
    volumes:
      - pg_data_node2:/home/postgres/pgdata
    depends_on:
      etcd:
        condition: service_healthy
      patroni-db1:
        condition: service_started

  pg-haproxy:
    image: haproxy:2.8-alpine
    container_name: community-db-lb
    restart: unless-stopped
    networks:
      - community-net
    ports:
      - "5432:5432"   # PostgreSQL 對外入口
      - "7000:7000"   # HAProxy Dashboard
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat <<'EOF' > /usr/local/etc/haproxy/haproxy.cfg
        global
            maxconn 1000

        defaults
            mode tcp
            timeout connect 5s
            timeout client 30m
            timeout server 30m

        frontend stats
            mode http
            bind *:7000
            stats enable
            stats uri /

        frontend postgres_front
            bind *:5432
            default_backend postgres_back

        backend postgres_back
            option httpchk GET /primary
            http-check expect status 200
            default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
            server patroni1 patroni-db1:5432 maxconn 100 check port 8008
            server patroni2 patroni-db2:5432 maxconn 100 check port 8008
        EOF
        exec haproxy -f /usr/local/etc/haproxy/haproxy.cfg
    depends_on:
      - patroni-db1
      - patroni-db2

  # ---------------------------------------------------------------------------
  # 4. Authentication & IAM (Casdoor)
  # ---------------------------------------------------------------------------
  casdoor:
    image: casbin/casdoor:v1.540.0
    container_name: community-casdoor
    restart: unless-stopped
    networks:
      - community-net
    ports:
      - "8000:8000"
    environment:
      - driverName=postgres
      - dataSourceName=user=postgres password=PGPassword123 host=pg-haproxy port=5432 sslmode=disable dbname=casdoor
    depends_on:
      - pg-haproxy

  # ---------------------------------------------------------------------------
  # 5. Message Queue (Kafka - KRaft 模式)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: community-kafka
    restart: unless-stopped
    networks:
      - community-net
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ---------------------------------------------------------------------------
  # 6. Object Storage (SeaweedFS)
  # ---------------------------------------------------------------------------
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: community-seaweedfs
    restart: unless-stopped
    networks:
      - community-net
    ports:
      - "8333:8333"   # S3 API Endpoint
      - "9333:9333"   # Master Server Dashboard
    command: "server -dir=/data -s3 -s3.port=8333"
    volumes:
      - seaweed_data:/data